baseURL: https://traveller.philoserf.com/
locale: en-us
title: A Referee’s Notebook
# Date-only front matter is midnight here, not UTC, so a post goes live on
# its own date rather than the evening before.
timeZone: America/Detroit
enableGitInfo: true
# A hand-set lastmod beats the git date: pages set lastmod when their content
# changes, while posts omit it and fall back to the last commit.
frontmatter:
  lastmod: [lastmod, ":git", date, publishDate]
enableRobotsTXT: true
disableKinds: [taxonomy, term]
taxonomies: {} # intentionally empty to disable tags and categories

params:
  author: "Mark Ayers"
  description: "Campaigns and commentary for the 1977 Classic Traveller rules: the Little Black Books before the Official Traveller Universe, with some notes on what came after."
  # The page colors the browser shows around the site: interior paper in
  # light and dark, and the cover black. baseof.html sets --paper and
  # --cover-black from these, so this is their only copy.
  themeColor:
    light: "#ffffff"
    dark: "#161616"
    cover: "#000000"

  # The cover: kicker and site title above the red rule, tagline below
  # TRAVELLER, and at the foot the opening of the Free Trader Beowulf
  # mayday, where Book 1 prints its publisher.
  home:
    kicker: "Supplement 0"
    tagline: "Campaigns and Commentary for the 1977 Rules"
    signal: "This is Free Trader Beowulf, calling anyone… Mayday, Mayday…"

mediaTypes:
  application/manifest+json:
    suffixes: [webmanifest]

outputFormats:
  llms:
    name: llms
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true
  manifest:
    name: manifest
    mediaType: application/manifest+json
    baseName: site
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - html
    - llms
    - manifest
  # The posts section's feed is the site's only feed: Hugo's own template
  # lists a section's pages, so the disclaimer stays out of it.
  section:
    - html
    - rss

menus:
  main:
    - name: Posts
      pageRef: /posts
      weight: 10
    - name: About
      pageRef: /about
      weight: 20
