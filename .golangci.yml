# golangci-lint v2 configuration — aggressively opinionated.
#
# Posture: enable every linter, then disable only those that fight this repo's
# deliberate design (transcribed rulebook tables, white-box tests, data globals)
# or standard idiomatic Go. See docs and CLAUDE.md for the rationale per linter.
version: "2"

linters:
  default: all
  disable:
    - exhaustruct # positional records / partial inits are intentional
    - mnd # the codebase IS transcribed rulebook tables (magic numbers by nature)
    - goconst # domain vocabulary (skills/careers) is string map keys, not consts
    - varnamelen # terse dice vars (r, c, d6) are idiomatic here
    - gomodguard # deprecated in v2.12; std-lib-only module has no blocked modules to guard
    - gochecknoglobals # career/table data are intentional package-level vars
    - noinlineerr # `if err := f(); err != nil` is standard Go
    - paralleltest # ~0 benefit on fast deterministic tests; huge manual churn
    - err113 # false-positive-prone; pointless sentinels for one-off CLI errors
    - wsl # deprecated; superseded by wsl_v5
    - testpackage # white-box tests are intentional (see file header) — internal package access to unexported generation/table logic
  settings:
    depguard:
      # Enforce the deliberate std-lib-only invariant (go.mod has no require
      # block): only the standard library and our own module may be imported, so
      # any new third-party dependency is flagged for a conscious decision.
      rules:
        main:
          list-mode: strict
          allow:
            - $gostd
            - github.com/philoserf/traveller
    lll:
      line-length: 120
    cyclop:
      max-complexity: 15
    funlen:
      lines: 80
      statements: 60
    gocognit:
      min-complexity: 25
    nestif:
      min-complexity: 6
    exhaustive:
      default-signifies-exhaustive: true # a default case handles the enum's remainder
    gosec:
      excludes:
        - G404 # game dice use a seedable math/rand PRNG by design, never cryptographic
    govet:
      enable-all: true
      disable:
        - fieldalignment # micro-optimization; noisy on the record structs
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      # The cmd/ CLIs print records to stdout via fmt.Print*; that is their job.
      # forbidigo stays enabled for the library packages, where a bare print is
      # a real smell (records there should be returned, not printed).
      #
      # Unanchored on purpose. Run from a git worktree, golangci-lint reports
      # paths relative to the worktree ("../../../cmd/worldgen/main.go"), so a
      # ^-anchored pattern silently stops matching and the CLIs light up with
      # phantom findings that do not reproduce from the repo root.
      - path: (^|/)cmd/
        linters:
          - forbidigo
      # Marine's and Soldier's own *_character_generate_test.go mirror the
      # same NeverQualified/Dies/Qualified test triad test-for-test,
      # deliberately, not incidentally — each one's own fixture values and
      # the reasoning behind them (why this UPP, why this exact Fame/Rank)
      # are the actual point of the test, not boilerplate a shared helper
      # should absorb. Named explicitly, not a *_character_generate_test.go
      # glob: Citizen's and Noble's own files share none of this rationale
      # (Citizen has no Dies path at all) and should stay covered by dupl.
      # Add a future risk-based career's own file here only once it
      # actually mirrors this exact shape.
      - path: character/(marine|soldier|spacer)_character_generate_test\.go
        linters:
          - dupl
      # The same deliberate mirroring as above, now also true of the three
      # Armed Forces careers' own _loop_test.go (Begin/Continue/CC-rotation/
      # Disabled/Death regression suites) and _promotion_test.go (rank
      # table pins, Commission/Promotion rate tests) once Spacer became a
      # third real instance of both shapes — each career's own exact
      # targets, seeds, and rank data are the point, not the surrounding
      # test scaffolding.
      - path: character/(marine|soldier|spacer)_(loop|promotion)_test\.go
        linters:
          - dupl
      # marine_generate_test.go/soldier_generate_test.go/spacer_generate_test.go
      # share the same deliberate mirroring as the two exclusions above, in
      # their own ~17-function ResolveXTerm batteries (SkipsRewardAndSkills-
      # OnDeath, GrantsFlatXSOnRiskSuccess, SetsRankEveryTerm, GrantsCommission,
      # etc.) — same UPP{} fixture, same rand.NewPCG(1, 1) seed, near-verbatim
      # assertions. dupl doesn't currently flag this trio (ResolveSpacerTerm's
      # own int branchRow vs. Marine's/Soldier's string branch parameter is
      # enough of an AST difference to defeat its clone detection), but the
      # duplication is the same acknowledged, deliberate shape as the files
      # above — listed here for consistency, not because dupl requires it.
      - path: character/(marine|soldier|spacer)_generate_test\.go
        linters:
          - dupl
      # rogue_muster_out_test.go and agent_muster_out_test.go both use
      # this session's own established TablesMatch/RollCountMatchesTerms/
      # EntriesAreFromTables/BothColumnsReachable four-function shape —
      # the same "test scaffolding, not the data, is what's shared"
      # reasoning as above. Their own underlying tables are genuinely
      # different (12-row, but different Money/Benefits values); dupl
      # only flags these two specifically because both are the plainest
      # instance of the shape (no extra wrinkle like Scholar's Edu param
      # or Merchant's isOfficer/tier), crossing dupl's own similarity
      # threshold. Extend this list if a future career's own muster-out
      # test file collides the same way.
      - path: character/(rogue|agent)_muster_out_test\.go
        linters:
          - dupl
      # marine_generate.go's ResolveMarineTerm and soldier_generate.go's
      # ResolveSoldierTerm are the production (non-test) counterpart to
      # the marine_generate_test.go exclusion above — same deliberate
      # per-career mirroring, same "Spacer's own int branchRow parameter
      # defeats dupl's clone detection" reason ResolveSpacerTerm never
      # joins this pair. Previously just under dupl's own detection
      # threshold; #53's otherwise-unrelated changes elsewhere in the
      # package shifted enough token-count context to surface it.
      - path: character/(marine|soldier)_generate\.go
        linters:
          - dupl

formatters:
  enable:
    - gofumpt
    - goimports
    - golines
  settings:
    gofumpt:
      extra-rules: true
    goimports:
      local-prefixes:
        - github.com/philoserf/traveller
    golines:
      max-len: 120
  exclusions:
    generated: lax
