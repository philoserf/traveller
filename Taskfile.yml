version: "3"

tasks:
  default:
    cmds:
      - task: help

  help:
    desc: Show available tasks
    cmds:
      - task --list

  setup:
    desc: Install required tools with Homebrew
    # Up to date only when every Brewfile entry is installed; a checksum of the
    # Brewfile would miss tools removed from the machine.
    status:
      - brew bundle check --file=Brewfile --no-upgrade
    cmds:
      - brew bundle
    platforms: [darwin]

  dev:
    desc: Start development server with drafts and future posts
    deps: [setup]
    cmds:
      - hugo server --buildDrafts --buildFuture --disableFastRender --baseURL http://localhost:1313/

  build:
    desc: Build site for production
    deps: [setup]
    cmds:
      # No sources/generates: the output also depends on git history (enableGitInfo).
      - bash build.sh

  ship:
    desc: 'Commit every change, open a PR and merge it (task ship -- "Commit title")'
    silent: true
    preconditions:
      - sh: test -n "{{.CLI_ARGS}}"
        msg: 'Give a commit title: task ship -- "Commit title"'
      - sh: test "$(git branch --show-current)" = main
        msg: Run ship from main
      - sh: test -n "$(git status --porcelain)"
        msg: Nothing to ship
    cmds:
      # CLI_ARGS arrives shell-quoted, so it is used unquoted.
      # Running ship is the review: it records the branch head as reviewed
      # before pr-cycle gates, opens and merges it.
      - |
        set -o errexit
        branch="ship-$(date +%Y%m%d-%H%M%S)"
        body="$(mktemp)"
        git stash push --quiet --include-untracked
        ~/.claude/bin/pr-cycle start "$branch"
        git stash pop --quiet
        git add --update
        git add content
        git commit --quiet --message {{.CLI_ARGS}}
        git diff --stat main..HEAD > "$body"
        ~/.claude/bin/pr-cycle reviewed "$branch"
        ~/.claude/bin/pr-cycle ship "$branch" {{.CLI_ARGS}} "$body"
        rm -f "$body"

  deploy:
    desc: Build and deploy by hand (Workers Builds deploys every push to main once connected)
    preconditions:
      - sh: test -z "$(git status --porcelain)"
        msg: Uncommitted changes; run task ship first
      - sh: git fetch --quiet origin main && test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
        msg: HEAD is not origin/main; ship and pull main before deploying
    cmds:
      # wrangler.jsonc's build.command validates and builds before uploading.
      - |
        if token=$(security find-generic-password -s cloudflare-api-token -w 2>/dev/null); then
          export CLOUDFLARE_API_TOKEN="$token"
        fi
        bunx wrangler deploy

  links:
    desc: Check external links and anchors in public/ (run task build first)
    cmds:
      # The site's own absolute URLs (canonical, og:url) are checked
      # against public/, not the live site, so a page not yet deployed passes.
      - lychee --cache --max-cache-age 2d --root-dir "$PWD/public" --remap "^https://traveller\\.philoserf\\.com/(.*)$ file://$PWD/public/\$1" --include-fragments --no-progress 'public/**/*.html'

  clean:
    desc: Clean up generated files
    cmds:
      - rm -rf public resources

  check:
    desc: Run the build's validate and strict passes in memory
    deps: [setup]
    cmds:
      - bash build.sh check

  new:
    desc: Create a new content file
    deps: [setup]
    cmds:
      - hugo new {{.CLI_ARGS}}
    silent: true

  new:post:
    desc: Create a new post
    deps: [setup]
    cmds:
      - hugo new posts/{{.CLI_ARGS}}.md
    silent: true

  format:
    desc: Format code with bun fmt (excluding Hugo templates)
    cmds:
      - bun fmt .

  optimize-images:
    desc: Optimize PNG and JPEG images in static/
    deps: [setup]
    cmds:
      - |
        echo "Optimizing PNG images..."
        find static -name "*.png" -exec pngquant --force --ext .png --quality=65-80 {} \;
        echo "Optimizing JPEG images..."
        find static \( -name "*.jpg" -o -name "*.jpeg" \) -exec mogrify -strip -interlace Plane -quality 85 {} \;
        echo "Image optimization complete."
